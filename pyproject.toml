[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-llm-agent-engine"
version = "0.1.0"
description = "A small, bounded Python agent layer for OpenAI-compatible model endpoints"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE", "LICENSE.PROPRIETARY"]
authors = [{ name = "Deathcharge" }]
keywords = ["agents", "llm", "openai-compatible", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Private :: Do Not Upload",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=6,<7",
]

[project.scripts]
helix-agent = "helix_llm_agent_engine.cli:main"

[project.urls]
Repository = "https://github.com/Deathcharge/helix-hub-shared"
Issues = "https://github.com/Deathcharge/helix-hub-shared/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["helix_llm_agent_engine*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: installed-package and command-level integration tests",
]

[tool.coverage.run]
branch = true
source = ["helix_llm_agent_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["agents", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/helix_llm_agent_engine"]
warn_unreachable = true

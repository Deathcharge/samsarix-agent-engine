[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    engine: test engine functionality
    agent: test agent functionality
    coordination: test coordination
    communication: test communication
    performance: test performance
    integration: test integration scenarios
